# 这个玩法的身份证。字段是定死的，别改字段名，照着把值填上。
# 智能助手靠这一份认玩法，用户挑玩法也先看这一份。

# 文件夹的名字，英文小写加连字符，比如 weather-forecast
name: your-scenario-name

# 玩法的中文名，清单里显示的就是这个
title: "你的玩法名"

# 谁做的。写你的 GitHub 名字就行，不许写真实姓名、邮箱这类个人信息
author: "your-github-name"

# 这个玩法自己的版本。改了内容就往上加，比如 0.1.0 改过一次变 0.1.1
version: "0.1.0"

# 能配哪个版本的通用规矩（core）用。core 升级之后你的玩法要是还能跑，
# 就把这里改成新版本号；还没试过就别改，免得别人照着用出问题
works_with: "core v0.1"

# 推荐哪一档：full 全自动 / semi 半自动 / manual 手动
# 新玩法一般写 semi，发布前人看一眼
automation: semi

# 数据从哪来，一句话写清。要花钱的源不许写，这个库只收免费的
sources: "数据来源写在这里，要写清网站或接口的名字"

# 入口文件清单：别人（和智能助手）从哪几个文件开始看、开始跑
entry:
  - "README.md"            # 总说明
  - "config.example.yaml"  # 这个玩法要多填的配置
  - "stages-diff.md"       # 跟通用规矩不一样的地方
  - "scene-notes.md"       # 画面怎么做

# 天气预报这个玩法要多填的配置。
# 通用配置在仓库根的 config.yaml 里，这份只放天气多出来的项。
# 用法：把这一段抄进你的 config.yaml，或者让你的智能助手照着合并。

scenario:
  weather:
    # 你要报哪个城市，写城市名就行
    city: "北京"
    # 这个城市的经纬度。换城市的时候一起换，查法在 sources.md 里：
    # 输城市名给 Open-Meteo 的地名接口，它会返回经纬度，抄过来
    latitude: 39.9075
    longitude: 116.3972
    # 每天几点发出去。天气要赶在大家出门前，推荐 7 点前
    publish_time: "07:00"
    # 一条视频看未来几天。推荐 7 天：今天说细，后面六天说大概，正好装得下
    forecast_days: 7
    # 时区别改错，写错了日期会差一天。国内城市就用这个
    timezone: "Asia/Shanghai"
